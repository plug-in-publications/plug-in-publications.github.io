colorScheme = "slate"
autoSwitchAppearance = "false"
smartTOC = true
enableEmoji = true
# mainSections = ["adult-books", "workshops", "children-books"]
mainSections = ["adult-books", "children-books", "workshops"]
defaultSocialImage = "img/logo.png"
description = "Plug-In Publications publishes children's books, self-help books and seasonal workshops for personal growth, self-discovery and meaningful transformation."
enableStructuredBreadcrumbs = true
# defaultAppearance = "dark"
# logo = "img/logo.png"

[homepage]
cardView = true
cardViewScreenWidth = false
showRecent = true
showRecentItems = 20 
layout = "profile"

[article]
showDate = false
showWordCount = false
showAuthor = false
showTableOfContents = true
showTaxonomies = true
relatedContentLimit = 3

[list]
groupByYear = false
cardView = true

[footer]
showThemeAttribution = false

[taxonomy]
heroStyle = "basic"
showHero = true

# Search engine site verification (rendered as <meta> tags in <head>).
[verification]
  google = "vz_1Wg5IurZYIiAI2Ai8WUiwEvsN-1cygpD7m-XvkYE"
  # bing = ""

[sitemap]
# Include term pages (author pages, category landing pages) in the sitemap.
# Tag pages and non-landing categories opt out via `sitemap.disable` cascades
# in content/tags/_index.md and content/categories/_index.md.
excludedKinds = ["taxonomy"]
