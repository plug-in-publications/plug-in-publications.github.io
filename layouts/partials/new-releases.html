{{ $releases := first 3 (where .Site.RegularPages "Params.featured" true) }}
{{ with $releases }}
  <h2 class="mt-8 text-2xl font-extrabold mb-4">New Releases</h2>
  <section class="w-full grid gap-4 sm:grid-cols-2 md:grid-cols-3 mb-10">
    {{ range . }}
      {{ partial "article-link/card.html" . }}
    {{ end }}
  </section>
{{ end }}
