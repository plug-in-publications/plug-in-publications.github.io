<form action="https://api.web3forms.com/submit" method="POST"
      class="space-y-6 max-w-xl">

  <input type="hidden" name="access_key" value="4efc7189-da8c-4fcc-aae4-30f07e684184">
  <input type="checkbox" name="botcheck" class="hidden">

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium">Name</label>
    <input type="text" name="name" required
           class="rounded-md border px-3 py-2 text-sm focus:outline-none focus:ring-2">
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium">Email</label>
    <input type="email" name="email" required
           class="rounded-md border px-3 py-2 text-sm focus:outline-none focus:ring-2">
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium">Message</label>
    <textarea name="message" rows="5" required
              class="rounded-md border px-3 py-2 text-sm focus:outline-none focus:ring-2"></textarea>
  </div>

  <button type="submit"
          class="rounded-md bg-primary-600 px-4 py-2 text-white hover:bg-primary-700">
    Send Message
  </button>
</form>
